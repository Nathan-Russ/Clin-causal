[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clincausal"
version = "0.1.0"
description = "Propensity score matching, IPTW, and doubly robust (AIPW) treatment effect estimation for observational clinical data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nathan Russell" }]
keywords = ["causal inference", "propensity score matching", "inverse probability weighting", "doubly robust estimation", "treatment effects", "biostatistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Nathan-Russ/clincausal"
Repository = "https://github.com/Nathan-Russ/clincausal"

[tool.setuptools.packages.find]
where = ["src"]
